[project]
name = "prompt-firewall-benchmarks"
version = "0.1.0"
description = "Versioned evasion-case corpus and scorer comparing prompt-firewall against raw Prompt Guard 2"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # Pinned to a commit SHA, not a tag, per prompt-firewall's own README guidance on
    # pinning anything security-sensitive -- this is exactly that context.
    "prompt-firewall[classifier] @ git+https://github.com/swadams2/prompt-firewall.git@4918b573e7ff89e95023e5eba6be8cc088527638",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "basedpyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["benchmarks"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
